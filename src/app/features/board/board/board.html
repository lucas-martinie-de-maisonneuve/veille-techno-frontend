<div class="board-container">
    @if (loading()) {
    <div class="flex justify-center items-center h-full">
        <mat-spinner />
    </div>
    } @else {
    <div class="board-columns"
        cdkDropList
        cdkDropListOrientation="horizontal"
        [cdkDropListData]="listsArray"
        (cdkDropListDropped)="onListDrop($event)">

        @for (list of lists(); track list.id) {
        <div class="board-column" cdkDrag cdkDragLockAxis="x">
            <app-list-column
                [list]="list"
                [connectedLists]="listIds"
                (deleteRequested)="deleteList(list.id)"
                (titleChanged)="updateListTitle(list.id, $event)" />
        </div>
        }

        @if (showAddList()) {
        <div class="board-column add-list-column">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>List title</mat-label>
                <input matInput [(ngModel)]="newListTitle" (keyup.enter)="addList()" autofocus />
            </mat-form-field>
            <div class="flex gap-2">
                <button mat-flat-button (click)="addList()">Add</button>
                <button mat-button (click)="cancelAddList()">Cancel</button>
            </div>
        </div>
        } @else {
        <button mat-button class="add-list-btn" (click)="showAddList.set(true)">
            <mat-icon>add</mat-icon>
            Add a list
        </button>
        }

    </div>

    @if (lists().length === 0 && !showAddList()) {
    <div class="empty-state">
        <mat-icon class="empty-icon">view_column</mat-icon>
        <p>No lists yet. Create your first list!</p>
    </div>
    }
    }
</div>
