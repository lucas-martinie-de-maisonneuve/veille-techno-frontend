<mat-toolbar class="header">
  <span class="flex-1">
    <a routerLink="/board" class="text-white no-underline font-bold text-lg">
      Kanban Board
    </a>
  </span>

  @if (authService.isLoggedIn()) {
    @if (authService.currentUser()?.role === 'admin') {
      <span class="role-badge">Admin</span>
      <button mat-icon-button routerLink="/admin/users" matTooltip="User management">
        <mat-icon>manage_accounts</mat-icon>
      </button>
    }
    <span class="username-display">{{ authService.currentUser()?.username }}</span>
    <button mat-icon-button (click)="openProfile()" matTooltip="Profile">
      <mat-icon>account_circle</mat-icon>
    </button>
    <button mat-icon-button (click)="authService.logout()" matTooltip="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <a mat-button routerLink="/login">Sign in</a>
  }
</mat-toolbar>
